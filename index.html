 جملة (جار ومجرور)","مفرد","جملة فعلية"],answer:0,explain:"«أمامَ» ظرف مكان منصوب، وهو مع المضاف إليه شبه جملة في محل رفع خبر."},{id:12,topic:"الخبر شبه الجملة",diff:1,q:"شبه الجملة يتكوّن من:",options:["جار ومجرور، أو ظرف","فعل وفاعل","مبتدأ وخبر","اسم واحد فقط"],answer:0,explain:"شبه الجملة نوعان: الجار والمجرور مثل «في الدارِ»، والظرف مثل «فوقَ الشجرةِ»."},{id:13,topic:"المبتدأ والخبر",diff:1,q:"الأصل في المبتدأ أن يكون:",options:["معرفة","نكرة دائماً","فعلاً","حرفاً"],answer:0,explain:"الأصل في المبتدأ أن يكون معرفة مثل «العلمُ نورٌ»، وقد يكون نكرة إذا وُجد مسوّغ."},{id:14,topic:"المبتدأ والخبر",diff:1,q:"المبتدأ والخبر في الجملة الاسمية يكونان:",options:["مرفوعين","منصوبين","مجرورين","المبتدأ مرفوع والخبر منصوب"],answer:0,explain:"الأصل أن يكون المبتدأ والخبر مرفوعين، مثل: «الصدقُ منجاةٌ»."},{id:15,topic:"الجملة الاسمية",diff:2,q:"أيّ الجمل الآتية جملة اسمية؟",options:["ذهبَ الولدُ إلى المدرسةِ","كتبَ الطالبُ الواجبَ","يقرأُ الطفلُ القصةَ","القمرُ ساطعٌ في السماءِ"],answer:3,explain:"«القمرُ ساطعٌ في السماءِ» بدأت باسم هو المبتدأ، أما الجمل الأخرى فبدأت بأفعال."},{id:16,topic:"الخبر الجملة",diff:3,q:"«الأمُّ تحبُّ أولادَها»؛ الجملة اسمية وخبرها:",options:["جملة فعلية","مفرد","شبه جملة","جملة اسمية"],answer:0,explain:"الجملة بدأت بالاسم «الأمُّ» فهي اسمية، والخبر «تحبُّ أولادَها» جملة فعلية في محل رفع."},{id:17,topic:"الخبر شبه الجملة",diff:3,q:"«العصفورُ فوقَ الشجرةِ»؛ شبه الجملة متعلّق بمحذوف تقديره:",options:["كائنٌ أو موجودٌ","يكتبُ","كتبَ","يجلسانِ"],answer:0,explain:"شبه الجملة يتعلق بمحذوف تقديره «كائنٌ» أو «موجودٌ» أو «استقرَّ»، ويكون الخبر في الحقيقة هو المحذوف."},{id:18,topic:"أنواع الخبر",diff:3,q:"«في الدارِ رجلٌ»؛ ما إعراب كلمة «رجلٌ»؟",options:["مبتدأ مؤخر","فاعل","خبر مقدم","مفعول به"],answer:0,explain:"«في الدارِ» شبه جملة خبر مقدم، و«رجلٌ» مبتدأ مؤخر مرفوع؛ لأن المبتدأ نكرة والخبر شبه جملة."},{id:19,topic:"الجملة الفعلية",diff:1,q:"ركنا الجملة الفعلية هما:",options:["فعل وفاعل","مبتدأ وخبر","جار ومجرور","نعت ومنعوت"],answer:0,explain:"تتكوّن الج
